# The NetState Lab Network: Fail2Ban filter for the lab's SSH log (Phase 2)
# The server writes SSH events straight to /var/log/auth.log, without the
# syslog prefix ("sshd[123]:") that Fail2Ban's standard sshd filter expects.
# These patterns match the lines exactly as the lab writes them.
[Definition]
failregex = ^Failed password for (?:invalid user )?\S+ from <HOST> port \d+ ssh2$
            ^Invalid user \S+ from <HOST> port \d+$
ignoreregex =
