# The NetState Lab Network: Fail2Ban on the SSH login (Phase 2)
# Off until Phase 2 turns it on:  docker compose exec server fail2ban-client start
# Reads the server's SSH log, and bans an address after too many failed logins.
# (Comments go on their own lines: Fail2Ban doesn't allow them after a value.)
[sshd]
enabled   = true
# The lab's own filter (see fail2ban-sshd-lab.conf for why)
filter    = sshd-lab
backend   = polling
logpath   = /var/log/auth.log
# sshd writes this log without dates, so Fail2Ban uses the time it reads each line
datepattern = {NONE}
banaction = iptables-multiport
port      = ssh
# Failed logins before a ban (original: 4)
maxretry  = 4
# Counted over 10 minutes
findtime  = 600
# Ban length in seconds (original: 1200s, 20 minutes; shortened so a demo can watch it end)
bantime   = 120
