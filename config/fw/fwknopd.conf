# The NetState Lab Network: fwknop (Single Packet Authorization), Phase 4
# fwknopd waits for one encrypted packet; when it validates, it opens the path
# to the server for the sender, briefly. The keys live in access.conf, which is
# generated at run time and never committed.
# On this build of fwknop (no libpcap), fwknopd listens on UDP 62201.
ENABLE_IPT_FORWARDING   Y;
