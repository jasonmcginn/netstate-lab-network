# The NetState Lab Network: a legacy port knock, recreated (Phase 2)
# The knock watcher reads this file when it starts. Change a value, restart the
# watcher, and the behaviour follows: configuration as code.

# The sequence: one packet to 4747, two to 3043, one to 9034, in that order.
KNOCK_SEQUENCE="4747 3043 3043 9034"

# The invalid TCP flag combination a knock packet must carry.
# FIN+PSH+URG never appears in a real connection. (The exact original flags aren't recorded.)
KNOCK_FLAGS="FIN,PSH,URG"

# Timers, in seconds. Shortened for the lab so you can watch them work.
KNOCK_WINDOW=30    # time to finish the sequence      (original: 60s, 1 minute)
DOOR_OPEN=60       # time the door stays open          (original: 300s, 5 minutes)
IDLE_DROP=120      # idle time before a session drops  (original: 900s, 15 minutes)

# What the door opens: SSH and RDP, for the knocking address only.
DOOR_PORTS="22,3389"
